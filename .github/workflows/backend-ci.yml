name: Backend CI

on:
  pull_request:
    branches:
      - main
      - 'issue/*'
    paths:
      - 'backend/**'

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: chmod +x gradlew

      - name: Build (compile)
        run: ./gradlew assemble

      - name: Test
        run: ./gradlew test
